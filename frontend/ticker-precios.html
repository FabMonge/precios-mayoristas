<!--
  Ticker de precios mayoristas · El Comercio
  Pegar tal cual en un bloque "Custom HTML" (Composer) o "HTML Box" (PageBuilder/Fusion).
  Cambia data-src por la URL pública del JSON y data-href por la URL de la nota con
  el dashboard: un clic en cualquier parte de la tira lleva a esa dirección. Sin
  data-href, la tira no tiene enlace. Puede haber varias instancias en la misma página.
-->
<div class="ec-ticker" data-ec-ticker
     data-src="https://fabmonge.github.io/precios-mayoristas/data/ticker_precios.json"
     data-href="https://elcomercio.pe/URL-DE-LA-NOTA/#precios-mayoristas"
     role="region" aria-label="Precios mayoristas de alimentos en Lima" hidden>
  <div class="ec-ticker__label">
    <span class="ec-ticker__title">Precios de hoy</span>
    <span class="ec-ticker__date"></span>
  </div>
  <div class="ec-ticker__viewport">
    <ul class="ec-ticker__track"></ul>
  </div>
</div>

<style>
  /* Estilo de la portada de elcomercio.pe: Roboto, fondo blanco y separadores finos
     como la tira "Temas del día"; rojo #D60000 de "EN VIVO" para las subidas. */
  .ec-ticker {
    --ec-bg: #fff;
    --ec-fg: #000;
    --ec-muted: #595959;
    --ec-linea: rgba(0, 0, 0, .2);  /* mismo separador que "Temas del día" */
    --ec-sube: #d60000;   /* precio sube = encarece para el consumidor */
    --ec-baja: #000;
    --ec-igual: #8c8c8c;
    --ec-icon: #000;      /* color de las siluetas */
    --ec-speed: 35;       /* píxeles por segundo */
    display: flex;
    align-items: stretch;
    height: 48px;
    background: var(--ec-bg);
    color: var(--ec-fg);
    font: 400 16px/1 Roboto, "Helvetica Neue", Arial, sans-serif;
    border-top: .8px solid var(--ec-linea);
    border-bottom: .8px solid var(--ec-linea);
    overflow: hidden;
    position: relative;
    box-sizing: border-box;
  }
  .ec-ticker[hidden] { display: none; }
  .ec-ticker *, .ec-ticker *::before, .ec-ticker *::after { box-sizing: border-box; }

  .ec-ticker__label {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 8px;
    align-self: center;
    padding: 0 15px;
    background: var(--ec-bg);
    border-right: .8px solid var(--ec-linea);
    z-index: 1;
  }
  .ec-ticker__title { font-weight: 700; }
  .ec-ticker__date  { font-size: 14px; color: var(--ec-muted); }

  .ec-ticker__viewport { flex: 1 1 auto; overflow: hidden; display: flex; align-items: center; }
  .ec-ticker__track {
    display: flex;
    flex-wrap: nowrap;
    margin: 0;
    padding: 0;
    list-style: none;
    white-space: nowrap;
    will-change: transform;
    animation: ec-ticker-scroll var(--ec-duration, 60s) linear infinite;
  }
  .ec-ticker:hover .ec-ticker__track,
  .ec-ticker:focus-within .ec-ticker__track { animation-play-state: paused; }

  .ec-ticker__item { display: inline-flex; align-items: center; padding: 0 20px; position: relative; }
  .ec-ticker__item::after {
    content: ""; position: absolute; right: 0; top: 50%;
    width: .8px; height: 20px; margin-top: -10px; background: var(--ec-linea);
  }
  .ec-ticker__item { gap: 7px; }
  /* Toda la tira es un solo enlace: una capa transparente encima de todo */
  .ec-ticker__enlace { position: absolute; inset: 0; z-index: 2; }
  .ec-ticker__enlace:focus-visible { outline: 2px solid var(--ec-fg); outline-offset: -2px; }
  .ec-ticker:hover .ec-ticker__title { text-decoration: underline; }
  .ec-ticker__icon  { flex: none; width: 20px; height: 20px; color: var(--ec-icon); }
  .ec-ticker__price { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ec-ticker__var   { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .ec-ticker__var--sube  { color: var(--ec-sube); }
  .ec-ticker__var--baja  { color: var(--ec-baja); }
  .ec-ticker__var--igual { color: var(--ec-igual); }
  .ec-ticker__item--stale { opacity: .55; }

  @keyframes ec-ticker-scroll {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }  /* la pista contiene 2 copias */
  }

  @media (max-width: 600px) {
    .ec-ticker { height: 44px; font-size: 14px; }
    .ec-ticker__label { flex-direction: column; align-items: flex-start; gap: 2px; padding: 0 10px; }
    .ec-ticker__title { font-size: 13px; }
    .ec-ticker__date  { font-size: 12px; }
    .ec-ticker__item  { padding: 0 14px; }
    .ec-ticker__var   { font-size: 13px; }
    .ec-ticker__icon  { width: 18px; height: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ec-ticker__track { animation: none; }
    .ec-ticker__viewport { overflow-x: auto; }
  }
</style>

  };
  function iconoSVG(nombre) {
    var trazos = ICONOS[nombre];
    if (!trazos) return "";
    return '<svg class="ec-ticker__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
      trazos.map(function (d) { return '<path fill="currentColor" fill-rule="evenodd" d="' + d + '"/>'; }).join("") + "</svg>";
  }

  // Hora de Lima (UTC-5, sin horario de verano) independiente del huso del lector
  function ahoraLima() {
    var d = new Date();
    return new Date(d.getTime() + d.getTimezoneOffset() * 60000 - 5 * 3600000);
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // Cache-busting: cambia cada día y cada hora de Lima, así las corridas de
  // 7, 8 y 9 a.m. se ven sin esperar a que expire la caché del CDN/navegador.
  function versionCache() {
    var l = ahoraLima();
    return "" + l.getFullYear() + pad(l.getMonth() + 1) + pad(l.getDate()) + "-" + pad(l.getHours());
  }

  // "2026-10-22" -> "22 oct" (sin new Date(iso), que lo interpretaría en UTC y restaría un día)
  function fechaCorta(iso) {
    var p = (iso || "").split("-");
    if (p.length !== 3) return "";
    return parseInt(p[2], 10) + " " + MESES[parseInt(p[1], 10) - 1];
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function itemHTML(it) {
    var v = it.variacion_pct;
    var tipo = v == null || Math.abs(v) < 0.05 ? "igual" : v > 0 ? "sube" : "baja";
    var flecha = { sube: "▲", baja: "▼", igual: "" }[tipo];
    var pct = v == null ? "" : (v > 0 ? "+" : "") + v.toFixed(1) + "%";
    // El nombre llega listo para mostrar ("Plátano seda Congo"), con mayúscula inicial como la portada
    var nombre = it.nombre;
    var titulo = nombre + (it.detalle ? " " + it.detalle.toLowerCase() : "") +
      ": S/ " + it.precio.toFixed(2) + " por " + (it.unidad || "kg") +
      (v == null ? "" : ", " + (tipo === "igual" ? "sin variación" : (tipo === "sube" ? "sube " : "baja ") + pct)) +
      (it.desactualizado ? " (dato del " + fechaCorta(it.fecha) + ")" : "");
    var contenido = iconoSVG(it.icono) +
      '<span class="ec-ticker__name">' + esc(nombre) + "</span>" +
      '<span class="ec-ticker__price">S/ ' + it.precio.toFixed(2) + "</span>" +
      '<span class="ec-ticker__var ec-ticker__var--' + tipo + '" aria-hidden="true">' +
      (flecha ? flecha + " " + pct.replace(/^[+-]/, "") : pct) + "</span>";
    return '<li class="ec-ticker__item' + (it.desactualizado ? " ec-ticker__item--stale" : "") +
      '" aria-label="' + esc(titulo) + '">' + contenido + "</li>";
  }

  function render(root, data) {
    var items = (data && data.items || []).filter(function (it) { return typeof it.precio === "number"; });
    if (!items.length) return;

    var track = root.querySelector(".ec-ticker__track");
    var viewport = root.querySelector(".ec-ticker__viewport");
    root.querySelector(".ec-ticker__date").textContent = "al " + fechaCorta(data.fecha_datos);

    var bloque = items.map(itemHTML).join("");
    track.innerHTML = bloque;
    root.hidden = false;

    // Un clic en cualquier parte de la tira lleva al inicio de la nota (siempre la misma dirección)
    var href = root.getAttribute("data-href");
    if (href && !root.querySelector(".ec-ticker__enlace")) {
      var enlace = document.createElement("a");
      enlace.className = "ec-ticker__enlace";
      enlace.href = href;
      enlace.setAttribute("aria-label", "Precios mayoristas de hoy: ver todos los precios y su evolución");
      root.appendChild(enlace);
    }

    // Repetir el bloque hasta cubrir el ancho visible, y luego duplicar todo:
    // la animación va de 0 a -50%, así el bucle es continuo y sin saltos.
    var anchoBloque = track.scrollWidth || 1;
    var veces = Math.max(1, Math.ceil(viewport.clientWidth / anchoBloque));
    var mitad = new Array(veces + 1).join(bloque);
    track.innerHTML = mitad + mitad;
    // La segunda mitad es decorativa para lectores de pantalla
    var lis = track.children;
    for (var i = items.length; i < lis.length; i++) lis[i].setAttribute("aria-hidden", "true");

    var velocidad = parseFloat(getComputedStyle(root).getPropertyValue("--ec-speed")) || 35;
    root.style.setProperty("--ec-duration", (track.scrollWidth / 2 / velocidad) + "s");
  }

  function cargar(root) {
    var src = root.getAttribute("data-src");
    if (!src) return;
    var url = src + (src.indexOf("?") > -1 ? "&" : "?") + "v=" + versionCache();
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl && setTimeout(function () { ctrl.abort(); }, 8000);

    fetch(url, { cache: "no-cache", signal: ctrl && ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) { render(root, data); })
      .catch(function (e) { if (window.console) console.warn("[ec-ticker]", e); }) // queda oculto
      .then(function () { if (timer) clearTimeout(timer); });
  }

  function init() {
    var nodos = document.querySelectorAll("[data-ec-ticker]:not([data-ec-ready])");
    for (var i = 0; i < nodos.length; i++) {
      nodos[i].setAttribute("data-ec-ready", "1");
      cargar(nodos[i]);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
</script>
